# Build the Windows installer on a GitHub-hosted Windows machine.
#   - Run manually: Actions tab > "Build Windows installer" > Run workflow,
#     then download the installer from the run's Artifacts.
#   - Push a tag like v1.0.1: also publishes the installer as a GitHub Release.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r windows-installer/requirements.txt
      - run: choco install innosetup -y --no-progress
      - run: python windows-installer/build_windows.py
        env:
          PYTHONUTF8: "1"
          # Repo secret (Settings > Secrets and variables > Actions) baked into the installer.
          SMARTPAY_PRINT_KEY: ${{ secrets.SMARTPAY_PRINT_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: MaeWang-SmartPay-Setup
          path: windows-installer/output/*
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-installer/output/*
